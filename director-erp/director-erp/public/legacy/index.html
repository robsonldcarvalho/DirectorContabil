<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161c;--sf:#18232c;--ink:#e6ecf1;--mut:#92a1af;--ln:#2a3945;--side:#0b1217;--acs:rgba(251,146,60,.14);--ac:#fb923c;--ok:#5fc18f;--warn:#e3b04b;--bad:#f2766b;--blue:#7fb2dd}}

body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,Arial,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-t);padding:18px 12px;display:flex;flex-direction:column;gap:4px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px}
.kpi b{display:block;font-size:28px;font-weight:600;line-height:1.1}.kpi span{color:var(--mut);font-size:13px}
.kpi.hot b{color:var(--ac)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:16px}
h3{margin:0 0 10px;font-size:14px;font-weight:600}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar i{display:block;height:10px;background:var(--ac);border-radius:3px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left}

.bar-t{color:var(--mut)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

textarea{width:100%;min-height:70px;resize:vertical}
.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:16px}.form .w{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.it{border-left:4px solid var(--ln);margin-bottom:10px}
.it.alta,.it.crítica{border-left-color:var(--bad)}.it.média{border-left-color:var(--warn)}.it.baixa{border-left-color:var(--blue)}
.it.resolvido{opacity:.7;border-left-color:var(--ok)}
.it h4{margin:0 0 4px;font-size:15px}.meta{color:var(--mut);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.tag{padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--ln)}
.tag.crítica,.tag.alta{color:var(--bad);border-color:var(--bad)}.tag.média{color:var(--warn);border-color:var(--warn)}.tag.baixa{color:var(--blue);border-color:var(--blue)}
.cm{background:var(--acs);border-radius:6px;padding:7px 9px;margin-top:8px;font-size:13px}
.empty{color:var(--mut);padding:24px;text-align:center}
.dic{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:3px 7px;border:1px solid currentColor;border-radius:99px;background:transparent;cursor:pointer;font-family:inherit}.dic:focus-visible{outline:2px solid var(--ac)}
.mods{position:relative}
aside .mt{width:100%;font-size:16px;font-weight:600;color:#fff;background:rgba(255,255,255,.1);justify-content:space-between}
.mm{display:block;margin-top:4px;background:rgba(0,0,0,.3);border-radius:8px;padding:4px}.mm button{width:100%;box-sizing:border-box;font-size:14px;font-weight:500}
:root[data-mod="task"]{--side:#064e3b;--side2:#0f766e;--ac:#0f766e;--acs:rgba(15,118,110,.1)}
:root[data-theme="dark"][data-mod="task"]{--side:#04110e;--side2:#0b2b26;--ac:#2dd4bf;--acs:rgba(45,212,191,.16)}
[data-mod="task"] aside button.on{background:linear-gradient(90deg,#14b8a6,#0d9488)}
.sg.dim{opacity:.25}.pd{grid-template-columns:28px minmax(150px,1fr) 110px 100px 1fr 90px 130px}
@media(max-width:760px){.pd{grid-template-columns:28px 1fr}}
.tr{display:grid;grid-template-columns:minmax(150px,230px) 1fr 62px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
.tr.th{color:var(--mut);font-size:11px;padding:2px 0;border:0}.th .seg span{text-align:center}
.seg{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.sg{height:20px;border:0;border-radius:4px;cursor:pointer;padding:0}.sg.ok{background:var(--ok)}.sg.late{background:var(--bad)}.sg.fut{background:var(--ln)}.sg:hover{filter:brightness(1.12)}.sg:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.tp{text-align:right;font-weight:600;font-size:13px}
@media(max-width:760px){.tr{grid-template-columns:1fr}.tp{text-align:left}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
aside{background:linear-gradient(180deg,var(--side),var(--side2))}
aside button.on{background:linear-gradient(90deg,#6366f1,#8b5cf6)}
aside .tg{justify-content:center;background:rgba(255,255,255,.12);color:#fff;margin-bottom:8px}
.card{box-shadow:0 1px 3px rgba(16,24,40,.08)}
.clk{cursor:pointer}.clk:hover{background:var(--acs)}td.clk:hover{outline:2px solid var(--ac)}
.kpis .card{border-top:4px solid var(--p1)}.kpis .card:nth-child(2){border-top-color:var(--bad)}.kpis .card:nth-child(3){border-top-color:var(--warn)}.kpis .card:nth-child(4){border-top-color:var(--ok)}.kpis .card:nth-child(5){border-top-color:var(--p2)}
.kpi b{color:var(--p1)}.kpis .card:nth-child(2) b{color:var(--bad)}.kpis .card:nth-child(3) b{color:var(--warn)}.kpis .card:nth-child(4) b{color:var(--ok)}.kpis .card:nth-child(5) b{color:var(--p2)}
.tag.alta{color:var(--p4);border-color:var(--p4)}.it.alta{border-left-color:var(--p4)}
:root[data-theme="dark"]{--bg:#0b1020;--sf:#141b2e;--ln:#26304a;--ink:#e8ecf8;--mut:#9aa6c4;--side:#0a0f1e;--side2:#151c3a;--ac:#818cf8;--acs:rgba(129,140,248,.16);--p1:#818cf8;--p2:#22d3ee;--p3:#f472b6;--p4:#fb923c;--p5:#4ade80;--p6:#a78bfa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;align-items:center}aside h1{width:100%;margin-bottom:4px}.me{margin:0;width:100%}main{padding:14px}}

/* ===== novo layout ===== */
.app{grid-template-columns:256px 1fr}
aside{background:var(--sf);color:var(--ink);border-right:1px solid var(--ln);padding:16px 12px;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
aside .mods{position:relative;margin:0 0 6px}
aside button.mt{box-sizing:border-box;width:100%;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--bg);border:1px solid var(--ln);color:var(--ink);font-size:14px;justify-content:flex-start}
.lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--p6));color:#fff;display:grid;place-items:center;font-weight:700}
.mtx{flex:1;display:flex;flex-direction:column;line-height:1.2}.mtx small{color:var(--mut);font-size:11px}
aside .mm{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--sf);border:1px solid var(--ln);box-shadow:0 10px 28px rgba(16,24,40,.16);padding:4px;border-radius:12px}
aside .mm button{color:var(--ink)}aside .mm button.on{background:var(--acs);color:var(--ac)}
.ns{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:14px 10px 4px}
aside button.nv{box-sizing:border-box;width:100%;gap:10px;align-items:center;justify-content:flex-start;padding:9px 10px;border-radius:10px;color:var(--mut);font-weight:500;position:relative;background:transparent}
aside button.nv:hover{background:var(--bg);color:var(--ink)}
aside button.nv.on{background:var(--acs);color:var(--ac);font-weight:600}
aside button.nv.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--ac)}
aside button.nv span{flex:1}
aside button.nv em{font-style:normal;font-size:11px;font-weight:700;background:var(--ac);color:#fff;border-radius:99px;padding:1px 7px}
.me{margin-top:auto;padding:12px 0 0;border-top:1px solid var(--ln)}
.uc{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{width:36px;height:36px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.un2{flex:1;display:flex;flex-direction:column;line-height:1.2;min-width:0}.un2 b{font-size:13px}.un2 small{color:var(--mut);font-size:11px}
aside button.tg{box-sizing:border-box;width:34px;height:34px;padding:0;justify-content:center;align-items:center;background:var(--bg);color:var(--ink);margin:0;border-radius:10px}
aside .me label{color:var(--mut);font-size:11px}
main{padding:24px 28px;max-width:1360px;width:100%}
.top h2{font-size:24px;letter-spacing:-.01em}
.card{border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.04)}
.card.clk:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(16,24,40,.12)}
.card>h3::before{content:"";display:inline-block;width:4px;height:14px;border-radius:2px;background:var(--ac);margin-right:8px;vertical-align:-2px}
.kpis .card:nth-child(1){--k:var(--p1)}.kpis .card:nth-child(2){--k:var(--bad)}.kpis .card:nth-child(3){--k:var(--warn)}.kpis .card:nth-child(4){--k:var(--ok)}.kpis .card:nth-child(5){--k:var(--p2)}
.kpis .card{border-top-width:1px;border-color:color-mix(in srgb,var(--k) 28%,var(--ln));background:linear-gradient(135deg,color-mix(in srgb,var(--k) 12%,var(--sf)),var(--sf))}
.kpi b{font-size:32px;letter-spacing:-.02em}.kpi span{font-weight:500}
.tag{background:color-mix(in srgb,currentColor 9%,transparent);border-radius:99px}
.btn{border-radius:10px;padding:9px 14px;box-shadow:0 1px 2px rgba(16,24,40,.12)}.btn.g{box-shadow:none;background:var(--sf)}
select,input,textarea{border-radius:10px}
.fb{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:16px}
.fb label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:3px}.fb select.wide{min-width:260px;max-width:100%}
.cards{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.co{display:flex;flex-direction:column;gap:10px}
.coh{display:flex;gap:10px;align-items:center}
.cav{width:40px;height:40px;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.con{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}.con b{font-size:15px;overflow-wrap:anywhere}.con small{color:var(--mut);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--bg);border-radius:12px;padding:10px;text-align:center}.stat b{font-size:20px;display:block}.stat small{color:var(--mut);font-size:11px}
.it{border-left-width:6px;border-radius:14px}
.mxg{display:grid;grid-template-columns:130px repeat(12,minmax(34px,1fr));gap:4px;align-items:center;min-width:640px}
.mx{height:30px;border:0;border-radius:8px;font-weight:700;color:#fff;cursor:pointer;padding:0;font-family:inherit}.mx.ok{background:var(--ok)}.mx.late{background:var(--bad)}.mx.fut{background:var(--ln);color:var(--mut)}.mx:disabled{cursor:default}.mx.dim{opacity:.25}.mx:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.mxh{font-size:11px;color:var(--mut);text-align:center}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--ln);flex-direction:row;flex-wrap:wrap}.ns,.mods,.me{width:100%}aside button.nv{width:auto}main{padding:14px}}

/* ===== login ===== */
#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#fff7ed,#fff 45%,#ffedd5);color:#1f2937;transition:opacity .5s,transform .5s}
#login[hidden]{display:none}#login.out{opacity:0;transform:scale(1.04);pointer-events:none}
#login canvas{position:absolute;inset:0;width:100%;height:100%}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:fl 18s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;background:#fb923c;left:-12vmax;top:-14vmax}.b2{width:40vmax;height:40vmax;background:#fdba74;right:-10vmax;bottom:-12vmax;animation-delay:-6s}.b3{width:30vmax;height:30vmax;background:#f97316;left:40%;top:50%;animation-delay:-11s;opacity:.22}
@keyframes fl{to{transform:translate(6vmax,4vmax) scale(1.15)}}
.lcard{position:relative;width:min(420px,92vw);box-sizing:border-box;padding:30px;border-radius:24px;background:rgba(255,255,255,.8);border:1px solid rgba(249,115,22,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(249,115,22,.18);transition:transform .15s;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}
.lcard.shake{animation:shk .45s}@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.llogo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#f97316,#fb923c);display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;margin-bottom:14px;box-shadow:0 8px 24px rgba(249,115,22,.4);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 8px 40px rgba(249,115,22,.65)}}
.lcard h1{margin:0 0 4px;font-size:24px;color:#1f2937}.pop{animation:popin .4s}@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.9)}}
.lcard p.lsub{margin:0 0 18px;color:#6b7280;font-size:13px}
.lf{position:relative;margin-bottom:12px}
.lf input{width:100%;box-sizing:border-box;padding:20px 44px 6px 14px;border-radius:12px;border:1px solid #fed7aa;background:#fff;color:#1f2937;font:inherit;outline:none;transition:.2s}
.lf input:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.2)}
.lf label{position:absolute;left:14px;top:14px;font-size:14px;color:#9a8574;pointer-events:none;transition:.18s;margin:0}
.lf input:focus+label,.lf input:not(:placeholder-shown)+label{top:5px;font-size:10px;color:#ea580c;font-weight:600}
.eye{all:unset;cursor:pointer;position:absolute;right:12px;top:13px;font-size:16px}.eye:focus-visible{outline:2px solid #f97316}
.lopt{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#6b7280;margin-bottom:8px}.lopt label{display:flex;gap:6px;align-items:center;color:#6b7280;margin:0}.lopt input{accent-color:#f97316}.lopt a{color:#ea580c;cursor:pointer;font-weight:500}
.lerr{min-height:18px;color:#dc2626;font-size:12px;margin:2px 0 8px}
.lbtn{all:unset;box-sizing:border-box;width:100%;text-align:center;padding:13px;border-radius:12px;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;font-weight:600;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s}
.lbtn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(249,115,22,.45)}.lbtn:active{transform:scale(.98)}.lbtn:focus-visible{outline:2px solid #1f2937;outline-offset:2px}
.lbtn.load::after{content:"";position:absolute;right:16px;top:50%;width:16px;height:16px;margin-top:-8px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lhint{margin:12px 0 0;text-align:center;font-size:11px;color:#9a8574}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(4);opacity:0}}
@media(prefers-reduced-motion:reduce){.blob,.llogo,.lcard{animation:none}}

/* ===== CRM/ERP/BI + demo ===== */
.rhd{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:0 0 12px}.rhd span{display:grid}.rhd small{color:var(--mut);font-size:11px}.rhd b{font-size:13px}
.rtabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 12px;border-bottom:1px solid var(--ln)}.rtab{all:unset;cursor:pointer;padding:9px 14px;border-radius:10px 10px 0 0;font-size:13px;color:var(--mut);transition:.2s}.rtab:hover,.rtab:focus-visible{color:var(--ac);background:var(--acs)}.rtab.on{color:var(--ac);font-weight:700;box-shadow:inset 0 -3px 0 var(--ac)}
.card.clk{cursor:pointer;transition:transform .2s,box-shadow .2s}.card.clk:hover,.card.clk:focus-visible{transform:translateY(-3px);box-shadow:0 10px 22px rgba(234,88,12,.2);outline:none}
:root[data-mod="radar"]{--side:#431407;--side2:#c2410c;--side-t:#fed7aa;--ac:#ea580c;--acs:rgba(234,88,12,.12)}
@media(prefers-color-scheme:dark){:root[data-mod="radar"]:not([data-theme="light"]){--ac:#fb923c;--acs:rgba(251,146,60,.16)}}:root[data-theme="dark"][data-mod="radar"]{--ac:#fb923c;--acs:rgba(251,146,60,.16)}

const $=s=>document.querySelector(s);
function filters(){return`<div class="f">${gsel()}<select onchange="setF('c',this.value)">${opts(cl().map(c=>[c.id,c.n]),F.c,"Todas as empresas")}</select><select onchange="setF('s',this.value)">${opts(mySec().map(s=>[s,s]),F.s,"Todos os setores")}</select><select onchange="setF('st',this.value)">${opts(Object.entries(ST),F.st,"Todos os status")}</select></div>`}
function dash(){const a=filt(),o=open(a),av=o.length?Math.round(o.reduce((s,i)=>s+(Date.now()-new Date(i.dt))/864e5,0)/o.length):0;
const byC=cl().map(c=>[c.n,o.filter(i=>i.c==c.id).length,c.id]).sort((x,y)=>y[1]-x[1]).filter(x=>x[1]>0).slice(0,8),byS=mySec().map(s=>[s,o.filter(i=>i.s==s).length,s]).sort((x,y)=>y[1]-x[1]);
const rec=[...a].sort((x,y)=>y.dt.localeCompare(x.dt)).slice(0,5);
return`<div class="top"><h2>Painel de gargalos${mgr()?"":" · "+sec(me())+(me().g=="ambos"?" · ambos os grupos":" · grupo "+me().g)}</h2></div>${filters()}
<div class="kpis"><div class="card kpi hot clk" onclick="openSum('k','aberto')"><b>${o.length}</b><span>Gargalos abertos</span></div><div class="card kpi clk" onclick="openSum('k','alta')"><b>${o.filter(i=>i.sev=="crítica"||i.sev=="alta").length}</b><span>Alta ou crítica</span></div><div class="card kpi clk" onclick="openSum('k','andamento')"><b>${a.filter(i=>i.st=="andamento").length}</b><span>Em andamento</span></div><div class="card kpi clk" onclick="openSum('k','resolvido')"><b>${a.filter(i=>i.st=="resolvido").length}</b><span>Resolvidos</span></div><div class="card kpi clk" onclick="openSum('k','aberto')"><b>${av}d</b><span>Idade média dos abertos</span></div></div>
${gxBlock(o,a)}
<div class="grid2"><div class="card"><h3>Abertos por empresa</h3>${bars(byC,"c")}</div><div class="card"><h3>Abertos por setor</h3>${bars(byS,"s")}</div>${canG()?`<div class="card"><h3>Abertos por grupo</h3>${bars(["01","02"].map(g=>["Grupo "+g,o.filter(i=>gOf(i.c)==g).length,g]),"g")}</div>`:""}</div>
<div class="grid2">${charts(a,o)}</div>
<div class="card"><h3>Registros recentes</h3>${rec.length?rec.map(i=>`<div class="bar" style="grid-template-columns:1fr auto"><span><b>${e(i.t)}</b><br><span class="bar-t">${e(cn(i.c))} · ${e(i.s)} · ${e(un(i.u))} · ${fmt(i)}</span></span><span class="tag ${i.sev}">${i.sev}</span></div>`).join(""):'<div class="empty">Nenhum gargalo com esses filtros.</div>'}</div>`}
function gar(){const a=filt().sort((x,y)=>y.dt.localeCompare(x.dt));
const form=`<div class="card form" style="margin-bottom:16px"><div class="w"><h3>Registrar gargalo</h3></div>
<div><label>Empresa</label><select id="nc" style="width:100%">${opts(S.companies.map(c=>[c.id,c.n]))}</select></div>
<div><label>Setor</label><select id="ns" style="width:100%">${opts(SECT.map(s=>[s,s]),me().s)}</select></div>
<div><label>Gravidade</label><select id="nv" style="width:100%">${opts(SEV.map(s=>[s,s]),"média")}</select></div>
<div class="w"><label>Título</label><input id="nt" style="width:100%" placeholder="Ex.: Cliente envia notas fiscais após o fechamento"></div>
<div class="w"><label>O que está travando e qual o impacto?</label><textarea id="nd"></textarea></div>
<div class="w"><button class="btn" onclick="addIt()">Registrar gargalo</button></div></div>`;
return`<div class="top"><h2>Gargalos</h2></div>${form}${filters()}${a.length?a.map(i=>`<div class="card it ${i.sev} ${i.st}"><h4>${e(i.t)}</h4><div class="meta"><span>${e(cn(i.c))}</span><span>${e(i.s)}</span><span>${e(un(i.u))}</span><span>${fmt(i)}</span><span class="tag ${i.sev}">${i.sev}</span>${mgr()?"":`<span class="tag">${ST[i.st]}</span>`}</div><div>${e(i.d)}</div>${i.cm?`<div class="cm"><b>Gestor:</b> ${e(i.cm)}</div>`:""}${mgr()?`<div class="f" style="margin:10px 0 0"><select onchange="upd(${i.id},'st',this.value)">${opts(Object.entries(ST),i.st)}</select><input style="flex:1;min-width:160px" placeholder="Comentário para o usuário" value="${e(i.cm)}" onchange="upd(${i.id},'cm',this.value)"></div>`:""}</div>`).join(""):'<div class="empty">Nenhum gargalo registrado. Use o formulário acima para criar o primeiro.</div>'}`}
function empOld(){return`<div class="top"><h2>Empresas</h2></div><div class="card form" style="margin-bottom:16px"><div><label>Nome</label><input id="en" style="width:100%"></div><div><label>Segmento</label><input id="es" style="width:100%"></div><div><label>Grupo</label><select id="eg" style="width:100%"><option value="01">Grupo 01</option><option value="02">Grupo 02</option></select></div><div style="align-self:end"><button class="btn" onclick="addC()">Adicionar empresa</button></div></div><div class="card sc"><table><tr><th>Empresa</th><th>Segmento</th><th>Grupo</th><th>Abertos</th><th>Total</th></tr>${S.companies.map(c=>`<tr><td>${e(c.n)}</td><td>${e(c.seg)}</td><td>${grpLbl(c.g)}</td><td>${open(S.items.filter(i=>i.c==c.id)).length}</td><td>${S.items.filter(i=>i.c==c.id).length}</td></tr>`).join("")}</table></div>`}
let UD=null,UDEL=0;
function usr(){const d=UD||{n:"",s:SECT[0],s2:"",g:"01",r:"user"},ed=UD&&UD.id;
return`<div class="top"><h2>Usuários</h2></div><div class="card form" style="margin-bottom:16px"><div class="w"><h3>${ed?"Editar usuário":"Novo usuário"}</h3></div><div><label>Nome</label><input id="un" style="width:100%" value="${e(d.n)}"></div><div><label>Setor</label><select id="us" style="width:100%">${opts(SECT.map(x=>[x,x]),d.s)}</select></div><div><label>Setor adicional (opcional)</label><select id="us2" style="width:100%">${opts(SECT.map(x=>[x,x]),d.s2,"Nenhum")}</select></div><div><label>Grupo</label><select id="ug" style="width:100%">${opts([["01","Grupo 01"],["02","Grupo 02"],["ambos","Todos os grupos"]],d.g)}</select></div><div><label>Perfil</label><select id="ur" style="width:100%">${opts([["user","Colaborador"],["gestor","Gestor"]],d.r)}</select></div><div><label>E-mail de acesso</label><input id="ue" type="email" style="width:100%" value="${e(d.email||"")}" placeholder="nome@${e(S.cfg.dom)}"></div><div><label>Senha de acesso</label><input id="up" type="password" autocomplete="new-password" style="width:100%" placeholder="${ed?"Em branco para manter":"Padrão: 1234"}"></div><div style="align-self:end"><button class="btn" onclick="saveU()">${ed?"Salvar alterações":"Adicionar usuário"}</button>${ed?` <button class="btn g" onclick="UD=null;UAC={};render()">Cancelar</button>`:""}</div></div>
<div class="card" id="acc_card" style="margin-bottom:16px">${accHtml()}</div>
<div class="card sc"><table><tr><th>Nome</th><th>E-mail</th><th>Setor</th><th>Grupo</th><th>Perfil</th><th>Registros</th><th></th></tr>${S.users.map(u=>`<tr><td>${e(u.n)}</td><td>${e(u.email||"—")}</td><td>${e(sec(u))}</td><td>${grpLbl(u.g)}</td><td>${u.r=="gestor"?"Gestor":"Colaborador"}</td><td>${S.items.filter(i=>i.u==u.id).length}</td><td style="white-space:nowrap">${UDEL==u.id?`Excluir? <button class="btn" onclick="delU(${u.id})">Sim</button> <button class="btn g" onclick="UDEL=0;render()">Não</button>`:`<button class="btn g" onclick="editU(${u.id})">Editar</button> <button class="btn g" onclick="UDEL=${u.id};render()">Excluir</button>`}</td></tr>`).join("")}</table></div>`}
function saveU(){const n=$("#un").value.trim();if(!n){toast("Informe o nome.");return}const st=$("#us").value,s2=$("#us2").value,o={n,s:st,ss:s2&&s2!=st?[st,s2]:[st],g:$("#ug").value,r:$("#ur").value},pn=$("#up").value;if(pn)o.pin=pn;else if(!(UD&&UD.id))o.pin="1234";const em=($("#ue").value.trim()||mailOf(n)).toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em)){alert("Informe um e-mail válido.");return}if(S.users.some(x=>x.email==em&&!(UD&&x.id==UD.id))){alert("Este e-mail já está em uso.");return}o.email=em;o.acc=accDiff();
if(UD&&UD.id){const u=S.users.find(x=>x.id==UD.id);if(u.r=="gestor"&&o.r!="gestor"&&S.users.filter(x=>x.r=="gestor").length<2){alert("Mantenha pelo menos um gestor.");return}Object.assign(u,o)}else S.users.push(Object.assign({id:Date.now()},o));UD=null;UAC={};save();render()}

function fbCollect(sp,cb){

 if(sp.cid||sp.k=="rmap"){ if(fbRestr()){
   const ids=(FB.perm.carteira||[]).filter(n=>typeof n=="number").slice(0,60);
   if(!ids.length){setTimeout(()=>cb([]),0);return subs}
   const parts={};let got=0;
   ids.forEach(id=>{let f=0;subs.push(col.where("cid","==",id).onSnapshot(sn=>{parts[id]=sn.docs;if(!f){f=1;got++}if(got>=ids.length)cb([].concat(...Object.values(parts)))},er=>{console.warn(sp.c,er&&er.code);if(!f){f=1;got++}if(got>=ids.length)cb([].concat(...Object.values(parts)))}))});

function fbApply(sp,docs){

function fbQueue(){if(!FB.ready)return;FB.q=1;clearTimeout(FB.tm);FB.tm=setTimeout(fbPush,350)}
async function fbPush(){
 if(FB.busy){FB.q=1;clearTimeout(FB.tm);FB.tm=setTimeout(fbPush,350);return}
 FB.busy=1;FB.q=0;let fail="";
 try{
  for(const sp of FSPEC){
   if(!fbCanWrite(sp)||FB.fail[sp.c])continue;
   const cur=fbDocs(sp),last=FB.last[sp.c]||{},sent=FB.sent[sp.c]=FB.sent[sp.c]||{},ops=[];
   Object.keys(cur).forEach(id=>{const j=cur[id].j;
    if(sp.w=="append"){if(last[id]!==undefined||sent[id])return}
    else if(last[id]===j)return;
    const exists=last[id]!==undefined,own=exists?(FB.own[sp.c]||{})[id]:FB.em;
    if(sp.w=="own"&&exists&&own!==FB.em&&!FB.admin)return;
    ops.push({t:"s",id,j,cid:cur[id].cid,own:own||FB.em})});
   if(sp.w!="append")Object.keys(last).forEach(id=>{if(cur[id])return;
    const own=(FB.own[sp.c]||{})[id];
    if(sp.w=="own"?(own===FB.em||FB.admin):FB.admin)ops.push({t:"d",id})});
   for(let i=0;i<ops.length;i+=400){
    const b=FB.db.batch(),part=ops.slice(i,i+400);
    part.forEach(o=>{const ref=FB.db.collection(sp.c).doc(o.id);
     if(o.t=="d")b.delete(ref);
     else{const d={j:o.j,v:1,by:FB.em,own:o.own,at:firebase.firestore.FieldValue.serverTimestamp()};if(o.cid!==undefined)d.cid=o.cid;b.set(ref,d)}});
    try{await b.commit();
     const L=FB.last[sp.c]=FB.last[sp.c]||{};part.forEach(o=>{if(o.t=="d"){delete L[o.id]}else{if(sp.w=="append")sent[o.id]=1;else L[o.id]=o.j;(FB.own[sp.c]=FB.own[sp.c]||{})[o.id]=o.own}})}
    catch(x){fail=(x&&x.code)||"erro";console.warn("push",sp.c,x)}}}
  if(FB.admin)await fbPerms();
 }catch(x){fail=(x&&x.code)||"erro";console.warn(x)}
 FB.busy=0;fbFlushPend();
 if(fail)toast("⚠ Alguma alteração não foi aceita pelo servidor ("+fail+"). Os dados voltam ao estado salvo.");
 if(FB.q){clearTimeout(FB.tm);FB.tm=setTimeout(fbPush,350)}}

function rndHex(){const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a).map(x=>x.toString(16).padStart(2,"0")).join("")}
async function pwSet(u,pw){pw=String(pw).trim();if(!HASPW){u.pin=pw;u.def=pw==="1234";return}u.salt=rndHex();u.ph=await pwHash(pw,u.salt);u.def=pw==="1234";delete u.pin}
async function pwChk(u,pw){pw=String(pw).trim();if(u.ph&&HASPW)return(await pwHash(pw,u.salt))===u.ph;return u.pin!=null&&u.pin!==""&&pw===String(u.pin).trim()}
const needPw=u=>!!u&&(u.def===true||(!u.ph&&String(u.pin||"").trim()==="1234"));

<script id="embedjs">
/* ===== Modo embutido (?embed=1): ponte com o app Next.js (mesmo domínio) ===== */
(function(){
 if(!/[?&]embed=1/.test(location.search)||parent===window)return;
 document.documentElement.classList.add("embed");
 try{sessionStorage.setItem("glg","1")}catch(x){}
 try{if(!S.auth)S.auth=true}catch(x){}

 csOpen=function(){send({t:"gerp-f2"})};
 goCad=function(k){send({t:"gerp-cad",k:k||""})};
 cdFicha=function(k){send({t:"gerp-cad",k:k||""})};
 /* #/<módulo>/<página>[/<empresa>[/<aba>]] */
 function ap(){
  var h=location.hash.replace(/^#\/?/,"");if(!h)return;
  var p=h.split("/"),m=p[0],v=p[1];if(!m||!v)return;
  S.mod=m;view=v;MO=false;try{MV=0;SUM=null;DOC=0}catch(x){}
  if(m=="radar"){if(v=="rdc"){RDC=p[2]?+p[2]:0;if(p[3])RDT=p[3]}}
  else if(m=="task"){TC=p[2]?+p[2]:0}
  else if(m=="garg"){F=Object.assign({},F,{c:p[2]?String(p[2]):""})}
  save();render();window.scrollTo(0,0)}
 /* a cada tela desenhada, avisa o React (URL + menu lateral) */
 var _r=render;
 render=function(){
  var r=_r.apply(this,arguments);
  try{
   var c=0,tab="";
   if(S.mod=="radar"&&view=="rdc"&&RDC){c=+RDC;tab=RDT||""}
   else if(S.mod=="task"&&TC){c=+TC}
   else if(S.mod=="garg"&&F&&F.c){c=+F.c}
   send({t:"gerp-nav",mod:S.mod,view:view,c:c,tab:tab})
  }catch(x){}
  return r};
 window.addEventListener("hashchange",ap);
 window.addEventListener("message",function(ev){var d=ev.data||{};if(d.t=="gerp-theme"){setTheme(d.theme);render()}else if(d.t=="gerp-reload"){S=load();render()}});

})();
